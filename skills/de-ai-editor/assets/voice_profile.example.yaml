# de-ai-editor 문체 지문 템플릿 (voice fingerprint)
# ─────────────────────────────────────────────────────────────
# 이 파일을 복사해 assets/voice_profile.yaml 로 저장한 뒤 본인 글 샘플로 채우세요.
#  - 없으면 de-ai-editor 는 '중립 비즈니스 레지스터'로 동작합니다(문제 없음).
#  - voice_profile.yaml 은 개인 문체라 공유 레포(endo-skills)에 커밋하지 않습니다(.gitignore).
#  - 채우는 법: 본인이 손으로 쓴 글 1~2개(같은 레지스터)를 Claude 에게 주고
#    "이 글로 de-ai-editor voice_profile 만들어줘" 라고 요청 → 아래 스키마로 추출해 줍니다.
#  - 원칙: 표본이 적으면 신뢰 높은 차원(종결어미·접속·구두점·격식·은어)만 값으로,
#    문장길이 통계 등은 밴드/참고로만. 시그니처는 '가끔'이면 가끔만(남발하면 도로 AI 티).
# ─────────────────────────────────────────────────────────────

voice_profile:
  meta:
    author: "<이름>"
    version: "v0.1"
    samples: 0
    status: "template — 본인 샘플로 채우기 전"

  # 레지스터별로 분리(글 성격이 다르면 종결·격식이 다름)
  registers:
    - id: report            # 정식 보고·의견서
      when: "정식 보고서·의견서·기획 논증"
      endings:
        primary: "<예: 합니다체 / 음슴체(현재·무시제)>"
        avoid: "<본인이 안 쓰는 종결. 예: 과거 음슴체 ~였음/~했음>"
        forbid_run: 3
        conf: high
    - id: email             # 대외·협업 메일
      when: "메일·협업 소통"
      endings: { primary: "<예: 해요체>", conf: high }

  common:
    application_principle: >-
      시그니처는 매번 적용하는 체크리스트가 아니라 상황 맞을 때 꺼내 쓰는 팔레트다.
      '가끔'인 습관은 가끔만 — 남발하면 그 자체가 새 'AI 티'가 된다. 의심스러우면 덜 쓰는 쪽.
    signature_moves: []       # 본인 글에서 반복되는 특징(있으면). 예: "개념을 따옴표로 집기"
    override_generic_tells: [] # 일반 룰엔 tell이지만 본인 시그니처라 허용할 것(가끔만)
    connectives:
      allow: []               # 본인이 실제 쓰는 접속어만
      avoid: ["또한", "즉", "따라서", "나아가", "종합하면", "결론적으로"]
      cap_per_para: 1
    punctuation:
      note: "본인 구두점 습관(괄호·대시·따옴표·말줄임 등)"
    formatting:
      bold: "펀치라인 위주"
      tables: allowed
      arrows: allowed
    lexicon_signature: []     # 즐겨 쓰는 표현(동의어로 밋밋하게 바꾸지 말 것)
    jargon_preserve: []       # 순화 금지 도메인 용어

  confidence_legend: >-
    high = 값으로 강제 · mid = 밴드로 유도 · low = 참고.
    표본이 적으면 종결어미·접속·구두점·격식·은어만 값으로, 통계 차원은 강제하지 않는다.
